<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    
    <!-- Google Analytics (GA4) is deferred via src/loadDeferredGa.js after window load -->
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5981606678113994" crossorigin="anonymous"></script>
    
    <!--
      SEO Meta Tags.

      Every route-varying tag below is stamped with data-react-helmet="true".
      That attribute hands ownership to react-helmet: on mount it replaces these
      tags instead of appending beside them, so the live DOM never ends up with
      two canonicals or two og:title values. src/components/DefaultSeo.js
      supplies the matching values for routes that declare none of their own,
      and backend/generate-article-pages.js swaps this whole block out for
      route-specific tags in each generated /news/index.html and
      /news/<slug>/index.html.

      Keep these values in sync with SITE_DEFAULTS in
      src/services/siteMetadata.js -- siteDefaults.test.js enforces it.
    -->
    <title>Scorecard - Home</title>
    <meta data-react-helmet="true" name="description" content="Track trading card sales on eBay. Get real-time price data, market analysis, and investment insights for sports cards, Magic: The Gathering, Pokemon, and more. Find recent sales, price trends, and live listings." />
    <meta data-react-helmet="true" name="keywords" content="trading cards, sports cards, eBay sales, card prices, market analysis, investment, Magic: The Gathering, Pokemon, Yu-Gi-Oh, PSA graded cards, card values" />
    <meta data-react-helmet="true" name="author" content="Scorecard" />
    
    <!-- Open Graph Meta Tags (for social media) -->
    <meta data-react-helmet="true" property="og:title" content="Scorecard - Home" />
    <meta data-react-helmet="true" property="og:description" content="Track trading card sales on eBay. Get real-time price data, market analysis, and investment insights for sports cards, Magic: The Gathering, Pokemon, and more." />
    <meta data-react-helmet="true" property="og:type" content="website" />
    <meta data-react-helmet="true" property="og:url" content="https://www.mancavesportscardsllc.com/" />
    <meta data-react-helmet="true" property="og:site_name" content="Scorecard" />
    <meta data-react-helmet="true" property="og:image" content="https://www.mancavesportscardsllc.com/logo512.png" />
    
    <!-- Twitter Card Meta Tags -->
    <meta data-react-helmet="true" name="twitter:card" content="summary_large_image" />
    <meta data-react-helmet="true" name="twitter:title" content="Scorecard - Home" />
    <meta data-react-helmet="true" name="twitter:description" content="Track trading card sales on eBay. Get real-time price data, market analysis, and investment insights." />
    <meta data-react-helmet="true" name="twitter:image" content="https://www.mancavesportscardsllc.com/logo512.png" />
    
    <!-- Additional SEO Meta Tags -->
    <meta data-react-helmet="true" name="robots" content="index, follow" />
    <link data-react-helmet="true" rel="canonical" href="https://www.mancavesportscardsllc.com/" />
    <meta name="googlebot" content="index, follow" />
    
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
